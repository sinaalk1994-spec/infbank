{% load ui %}<article class="document-card"><a class="document-preview" href="{% url 'document' doc.pk %}" target="_blank" rel="noopener">{% if doc.mime == 'application/pdf' %}<svg><use href="#sheet"/></svg><span>PDF</span>{% else %}<img loading="lazy" src="{% url 'document' doc.pk %}" alt="{{ doc.title }}">{% endif %}</a><div><strong>{{ doc.title }}</strong><small>{{ doc.get_kind_display }} · {{ doc.license.member.name }}</small><a class="text-link" href="{% url 'document' doc.pk %}?download=1">دریافت فایل <svg><use href="#download"/></svg></a></div></article>
