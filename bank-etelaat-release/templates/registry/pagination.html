{% load ui %}{% if page %}<div class="pagination"><span>صفحه {{ page.number|fa }} از {{ page.paginator.num_pages|fa }}</span><div>{% if page.has_previous %}<a class="button small-button" href="?page={{ page.previous_page_number }}&q={{ q|urlencode }}&grade={{ selected_grade|urlencode }}&status={{ status|urlencode }}">قبلی</a>{% endif %}{% if page.has_next %}<a class="button small-button" href="?page={{ page.next_page_number }}&q={{ q|urlencode }}&grade={{ selected_grade|urlencode }}&status={{ status|urlencode }}">بعدی</a>{% endif %}</div></div>{% endif %}
